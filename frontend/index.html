<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH SCREEN: shown when the user is not logged in -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h1>Task Manager</h1>

    <div class="auth-tabs">
      <button id="showLogin" class="tab-btn active">Login</button>
      <button id="showRegister" class="tab-btn">Register</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit" class="btn-primary">Login</button>
      <p class="error-msg" id="loginError"></p>
    </form>

    <!-- Register form -->
    <form id="registerForm" class="auth-form hidden">
      <input type="text" id="registerName" placeholder="Full Name" required>
      <input type="email" id="registerEmail" placeholder="Email" required>
      <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required minlength="6">
      <button type="submit" class="btn-primary">Create Account</button>
      <p class="error-msg" id="registerError"></p>
    </form>
  </div>
</div>

<!-- DASHBOARD: shown after login -->
<div id="dashboard" class="dashboard hidden">
  <nav class="dash-nav">
    <div class="wrap">
      <h2>Task Manager</h2>
      <div class="nav-right">
        <span id="userNameLabel"></span>
        <button id="logoutBtn" class="btn-ghost">Logout</button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <form id="taskForm" class="task-form">
      <input type="text" id="taskTitle" placeholder="Task title" required>
      <input type="text" id="taskDescription" placeholder="Description (optional)">
      <input type="date" id="taskDueDate">
      <select id="taskStatus">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
      <button type="submit" class="btn-primary">Add Task</button>
    </form>

    <div id="statsBar" class="stats-bar hidden">
      <div class="stat">
        <span class="stat-num" id="statTotal">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statPending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statProgress">0</span>
        <span class="stat-label">In Progress</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div id="taskList" class="task-list"></div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
